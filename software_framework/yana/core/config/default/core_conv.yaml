# CONV PE: event-driven spatial expansion
type: CONV
neuron_config:
  emit_spikes: false
  leak_enabled: false
  tau_mem_inv: 0.0
  threshold: 0.0
  leak_lut_len: 32
quant_config: "yana/core/config/default/quant_hidden.yaml"
conv_config:
  in_channels: 0
  out_channels: 0
  kernel_size: [3, 3]
  stride: [1, 1]
  padding: [0, 0]
  dilation: [1, 1]
  in_hw: [0, 0]  # input feature-map size for CONV PE (height, width)
