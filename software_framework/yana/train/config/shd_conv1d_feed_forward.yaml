trainer_cfg:
  output_path: "./output/shd/conv1d_feed_forward/"
  device_num: -1
  batch_size: 512
  num_epochs: 50
  num_workers: 4
  es_patience: 15
  checkpoint_path: null
  random_seed: 1

  dataset_cfg:
    dataset: "SHD"
    path: "datasets/"
    disk_cache: false

    num_samples: -1
    num_output_classes: 20
    train_split: 0.8

    transform_cfg:
      n_time_bins: 100
      time_window: 0
      spatial_factor: 4
      merge_polarities: true
      augmentation_enabled: false
      augmentation_transforms: {}

model_cfg:
  network_type: "custom_sequential_state"
  network_cfg:
    layers:
      # SHD after ToChannelsLength: (C, L) = (1, 175)
      - type: "Conv1d"
        params:
          in_channels: network_input_features
          out_channels: 5
          kernel_size: 7
          stride: 1
          padding: 1
          bias: false
      - type: "create_hidden_cell"
        params:
          neuron_type: "lif_quant"
          tau_inv_mem: 0.01
          threshold: 0.01
      - type: "Flatten"
      - type: "Linear"
        params:
          in_features: null
          out_features: network_output_features
          bias: false
      - type: "create_output_cell"
        params:
          neuron_type: "i_quant"
          tau_inv_mem: 0.0

    dt: 1.0

    weight_init_enable: false
    weight_init_type: "custom"
    weight_init_gain: 1.0
    weight_init_gain_ramp: 0.0

  optimizer_cfg:
    optimizer: "Adam"
    loss: "nll"
    lr: 0.001
    lr_scheduler: "cosine"
    lr_scheduler_cfg:
      max_epoch: 40
    spikerate_target: 0.0
    spikerate_loss_coefficient: 0.0
    weight_decay: 0.0

  enable_tracking: false
  decoder_transforms: [
    "pick_last",
    "log_softmax"
  ]

pruning_cfg:
  pruned_layers: []
  scheduler_cfg:
    target_sparsity: 0.80
    increment: 0.20
    frequency: 2
